<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment Results</title>
    <link rel="stylesheet" href="/static/results.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Experiment Results</h1>
        <div class="controls">
            <label for="viewModeSelect">View Mode:</label>
            <select id="viewModeSelect">
                <option value="phenomenon">Group by Grammatical Phenomenon</option>
                <option value="model">Group by Model</option>
            </select>
            <label for="filterSelect">Filter by:</label>
            <select id="filterSelect"></select>
        </div>
        <div class="chart-container">
            <canvas id="resultsChart"></canvas>
        </div>
    </div>
    <script src="/static/results.js"></script>
</body>
</html>
