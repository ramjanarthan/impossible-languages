<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment Results</title>
    <link rel="stylesheet" href="/static/results.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Experiment Results Dashboard</h1>
        <div class="controls">
            <div class="control-group">
                <label for="viewModeSelect">View Mode</label>
                <select id="viewModeSelect">
                    <option value="phenomenon">Group by Grammatical Phenomenon</option>
                    <option value="model">Group by Model</option>
                </select>
            </div>
            <div class="control-group">
                <label for="filterSelect">Filter</label>
                <select id="filterSelect"></select>
            </div>
            <div class="control-group toggle-group">
                <label class="toggle">
                    <input type="checkbox" id="showTrendLine" checked>
                    <span class="toggle-slider"></span>
                </label>
                <label for="showTrendLine" class="toggle-label">Show Trend Line</label>
            </div>
        </div>
        <div class="chart-container">
            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                Loading data...
            </div>
            <canvas id="resultsChart" style="display: none;"></canvas>
        </div>
    </div>
    <script src="/static/results.js"></script>
</body>
</html>
